<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falcon One APEX | AI Prospect Discovery</title><style>
:root{--blue:#1768e8;--red:#e52537;--navy:#14264b;--bg:#f4f7fc;--line:#dce5f1;--muted:#62748d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px Inter,system-ui,Arial}header{background:white;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:4}.logo{font-size:20px;font-weight:900;color:var(--blue)}.logo span{color:var(--red)}header b{border-left:3px solid var(--red);padding-left:14px}header .right{margin-left:auto;display:flex;gap:8px}button,select,input{font:inherit}button{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:600}button:hover{border-color:var(--blue);color:var(--blue)}.primary{background:var(--blue);color:white;border-color:var(--blue)}main{max-width:1440px;margin:auto;padding:20px}.intro{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.intro h1{margin:0 0 5px;font-size:25px}.muted{color:var(--muted)}.badge{background:#e8f0ff;color:var(--blue);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.card{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:0 2px 8px #16345c08}.stat strong{font-size:24px;display:block}.stat small{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:8px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:13px}.filters input,.filters select{min-width:0;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.prospect{padding:15px}.top{display:flex;align-items:center;gap:10px}.initials{width:42px;height:42px;border-radius:11px;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.name{font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:3px}.score{margin-left:auto;padding:6px 8px;border-radius:9px;background:#e7f8ee;color:#13834b;font-weight:800}.score.mid{background:#fff3d7;color:#9b6d10}.score.low{background:#ffebef;color:#b72a40}.description{color:#53647d;line-height:1.5;margin:13px 0;font-size:13px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;background:#f2f5fa;border:1px solid #e3eaf3;padding:4px 7px;border-radius:6px}.foot{border-top:1px solid #edf1f6;margin-top:12px;padding-top:10px;display:flex;justify-content:space-between;gap:6px}.foot button{font-size:12px;padding:7px}.save{color:var(--blue)}.saved{background:#e7f8ef;color:#11814a}.toolbar{display:flex;justify-content:space-between;margin:12px 0;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)}.modalbg{display:none;position:fixed;inset:0;background:#10223b88;z-index:10;align-items:center;justify-content:center;padding:16px}.modal{background:white;border-radius:15px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.detail{background:#f6f8fb;padding:11px;border-radius:9px}.detail small{display:block;color:var(--muted);margin-bottom:4px}.close{float:right}.toast{position:fixed;bottom:15px;right:15px;background:var(--navy);color:white;padding:12px;border-radius:10px;display:none;z-index:20}.toast.show{display:block}@media(max-width:900px){.results{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}@media(max-width:600px){header{padding:10px;gap:8px}.logo{font-size:17px}header b{display:none}.right button:first-child{display:none}main{padding:12px}.intro{display:block}.badge{display:inline-block;margin-top:8px}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:11px}.stat strong{font-size:21px}.filters{grid-template-columns:1fr}.results{grid-template-columns:1fr}.toolbar{flex-direction:column;gap:4px}.modalgrid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="logo">FALCON <span>ONE</span><small style="display:block;font-size:10px;letter-spacing:3px">APEX</small></div><b>AI Prospect Discovery</b><div class="right"><button id="savedBtn">CRM Shortlist <span id="savedCount">0</span></button><button class="primary" id="export">Export CSV</button><button onclick="location.href='index.html'">← Dashboard</button></div></header><main><div class="intro"><div><h1>AI Prospect Discovery</h1><div class="muted">Discover, filter, score, profile and shortlist companies across markets.</div></div><span class="badge">SCORING ENABLED · DEMO DATA</span></div><section class="stats"><div class="stat"><strong id="total">0</strong><small>Companies in discovery</small></div><div class="stat"><strong id="high">0</strong><small>High fit · score 80+</small></div><div class="stat"><strong id="markets">0</strong><small>Markets represented</small></div><div class="stat"><strong id="savedStat">0</strong><small>Saved to CRM shortlist</small></div></section><section class="filters"><input id="search" class="search" placeholder="Search company, keyword or location…"><select id="country"><option value="">All countries</option></select><select id="industry"><option value="">All industries</option></select><select id="scoreFilter"><option value="">Any score</option><option value="high">High fit · 80+</option><option value="mid">Potential · 60–79</option><option value="low">Below 60</option></select><button id="reset">Reset</button></section><div class="toolbar"><span id="label">Companies</span><span>Sorted by AI fit score</span></div><section class="results" id="results"></section></main><div class="modalbg" id="bg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script>
const companies=[
["Delta Manufacturing (Pty) Ltd","South Africa","Johannesburg","Manufacturing",96,"250–500 employees","Operations Director","Infrastructure modernisation, automation and operational visibility.",["Expansion signal","Technology modernisation","Large workforce"],"Manufacturing prospect with strong indicators for IT infrastructure refresh and workflow automation."],
["Nyati Holdings","Zimbabwe","Harare","Conglomerate",92,"100–250 employees","Group Procurement","IT consolidation, network upgrades and support services.",["Group structure","Cross-business opportunity"],"Multi-business group with potential cross-division technology opportunities."],
["Capital Health Group","South Africa","Pretoria","Healthcare",89,"500+ employees","IT Director","Security posture, Microsoft 365 governance and endpoint protection.",["Healthcare","Security needs","Multi-site"],"Healthcare group with potential for managed IT, security and compliance-oriented services."],
["Kopano Retail Group","South Africa","Cape Town","Retail",86,"100–250 employees","IT Manager","POS reliability, branch networking and cybersecurity.",["Multi-branch","Retail systems"],"Retail group where managed networks and endpoint security could reduce operational risk."],
["Foodserv Distribution","South Africa","Durban","Wholesale & Distribution",84,"250–500 employees","Head of Operations","Warehouse connectivity, rugged devices and automation.",["Logistics footprint","Operational complexity"],"Distribution business with frontline connectivity and support needs."],
["Botswana Mining Services","Botswana","Gaborone","Mining",81,"100–250 employees","Procurement Lead","Site networking, rugged devices and security monitoring.",["Remote sites","Critical operations"],"Mining-services business with remote-site technology requirements."],
["Moyo Logistics","Zimbabwe","Bulawayo","Logistics",78,"50–100 employees","Managing Director","Fleet connectivity, tracking and IT support.",["Fleet growth","Regional operations"],"Logistics prospect for networking, device and support services."],
["Phezulu Finance","South Africa","Durban","Financial Services",77,"50–100 employees","Risk Manager","Endpoint security, backups and business continuity.",["Sensitive data","Continuity"],"Financial services prospect with resilience and security needs."],
["GreenFields Agro","Zimbabwe","Gweru","Agriculture",73,"100–250 employees","Farm Operations Manager","Connectivity, business systems and farm digitisation.",["Seasonal operations","Digitisation"],"Agriculture prospect for connected operations and business-system support."],
["Zambezi Tourism Group","Zimbabwe","Victoria Falls","Hospitality",70,"100–250 employees","Group IT","Guest Wi-Fi, booking systems and multi-site support.",["Hospitality","Guest experience"],"Hospitality group where network experience and managed support could help."],
["Imbizo Legal Partners","South Africa","Johannesburg","Professional Services",68,"20–50 employees","Practice Manager","Microsoft 365, document security and helpdesk.",["Professional services","Cloud adoption"],"Professional-services firm with productivity and security service potential."],
["NamTech Solutions","Namibia","Windhoek","Technology",61,"20–50 employees","Founder","Cloud infrastructure and strategic managed-support partnerships.",["Tech sector","Partner potential"],"Potential channel or strategic technology partner in Namibia."]
];
const key="apexPhase2CRM";let saved=JSON.parse(localStorage.getItem(key)||"[]");const $=id=>document.getElementById(id);
function filtersInit(){[...new Set(companies.map(c=>c[1]))].sort().forEach(x=>$("country").insertAdjacentHTML("beforeend",'<option>'+x+'</option>'));[...new Set(companies.map(c=>c[3]))].sort().forEach(x=>$("industry").insertAdjacentHTML("beforeend",'<option>'+x+'</option>'))}
function render(){const q=$("search").value.toLowerCase(),co=$("country").value,ind=$("industry").value,sf=$("scoreFilter").value;let arr=companies.filter(c=>(!q||c.join(" ").toLowerCase().includes(q))&&(!co||c[1]===co)&&(!ind||c[3]===ind)&&(!sf||(sf==="high"?c[4]>=80:sf==="mid"?c[4]>=60&&c[4]<80:c[4]<60))).sort((a,b)=>b[4]-a[4]);$("results").innerHTML=arr.length?arr.map(c=>{const isSaved=saved.some(s=>s[0]===c[0]),cls=c[4]>=80?"":c[4]>=60?"mid":"low";return '<article class="card prospect"><div class="top"><div class="initials">'+c[0].split(/\s+/).map(w=>w[0]).slice(0,2).join("")+'</div><div><div class="name">'+c[0]+'</div><div class="sub">'+c[2]+', '+c[1]+' · '+c[3]+'</div></div><span class="score '+cls+'">'+c[4]+'</span></div><p class="description">'+c[9]+'</p><div class="tags">'+c[8].map(t=>'<span class="tag">'+t+'</span>').join("")+'</div><div class="foot"><button onclick="profile(\''+c[0].replaceAll("'","\\'")+'\')">View Profile</button><button class="'+(isSaved?'saved':'save')+'" onclick="save(\''+c[0].replaceAll("'","\\'")+'\')">'+(isSaved?'✓ Saved':'＋ Save to CRM')+'</button></div></article>'}).join(""):'<div class="card empty">No companies match. Adjust your filters or search.</div>'; $("label").textContent='Showing '+arr.length+' of '+companies.length+' sample companies';$("total").textContent=companies.length;$("high").textContent=companies.filter(c=>c[4]>=80).length;$("markets").textContent=new Set(companies.map(c=>c[1])).size;$("savedCount").textContent=$("savedStat").textContent=saved.length}
function save(name){const c=companies.find(x=>x[0]===name);if(!c)return;if(saved.some(x=>x[0]===name)){toast("Already in your CRM shortlist.");return}saved.push(c);localStorage.setItem(key,JSON.stringify(saved));render();toast(name+" saved to CRM shortlist")}
function profile(name){const c=companies.find(x=>x[0]===name);if(!c)return;$("modal").innerHTML='<button class="close" onclick="closeModal()">✕</button><h2>'+c[0]+'</h2><p class="muted">'+c[2]+', '+c[1]+' · '+c[3]+'</p><div class="modalgrid"><div class="detail"><small>AI Fit Score</small><b>'+c[4]+'/100</b></div><div class="detail"><small>Company size</small><b>'+c[5]+'</b></div><div class="detail"><small>Suggested decision-maker</small><b>'+c[6]+'</b></div><div class="detail"><small>Profile type</small><b>Sample prospect</b></div></div><h3>Opportunity hypothesis</h3><p>'+c[7]+'</p><h3>Discovery signals</h3><div class="tags">'+c[8].map(t=>'<span class="tag">'+t+'</span>').join("")+'</div><p class="muted">'+c[9]+'</p><button class="primary" onclick="save(\''+c[0].replaceAll("'","\\'")+'\')">Save Prospect to CRM</button>';$("bg").style.display="flex"}
function closeModal(){$("bg").style.display="none"}function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2400)}
function exportCSV(){let rows=[["Company","Country","City","Industry","Score","Size","Decision Maker","Opportunity"],...saved.map(c=>[c[0],c[1],c[2],c[3],c[4],c[5],c[6],c[7]])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\n"),blob=new Blob([csv],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="falcon-apex-prospect-shortlist.csv";a.click();URL.revokeObjectURL(a.href)}
["search","country","industry","scoreFilter"].forEach(id=>$(id).addEventListener("input",render));$("reset").onclick=()=>{["search","country","industry","scoreFilter"].forEach(id=>$(id).value="");render()};$("export").onclick=exportCSV;$("savedBtn").onclick=()=>{render();toast(saved.length+" prospects saved locally. Use Export CSV to download.");};$("bg").onclick=e=>{if(e.target===$("bg"))closeModal()};filtersInit();render();
</script></body></html>
